[project]
name = "finos"
version = "0.1.0"
description = "Turns monthly bank and card statements into a checked, categorised record"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "google-auth[requests]>=2.40",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
finos = "finos.cli:app"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: talks to real Neon, Doppler, Drive or Claude; needs a configured cloud session",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

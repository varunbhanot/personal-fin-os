# SBI Card Aurum credit card.
# The markers and summary labels were checked on the first real statement with finos identify.
# The hints are still first guesses.
id: sbi-card
kind: card
# "Minimum Amount Due" is printed only on card statements, so a bank statement that names
# SBI Card in a bill payment narration does not match this profile.
markers: [SBI Card, Minimum Amount Due]
# Text that a bank narration prints when it pays this card's bill. Checked on the real
# record with finos transfers.
transfer_markers: [SBI Card]
password_secret: PW_SBI_CARD
# A refund can carry the date of its purchase: one printed 10 days before the period start.
period_slack_days: 15
# The card number is printed with only its last two digits (seen on the first statement).
account_digits: 2
# The Total Outstanding is printed rounded to the rupee (seen on the first statement: a 0.01
# gap). The check trusts this only because the debit subtotals and credits are transcribed too.
closing_rounded_to_rupee: true
hints: |
  A credit card statement. Opening is the Previous Balance and closing is the Total
  Outstanding that ends the account summary, both as amounts owed. The Total Amount Due can
  be smaller, because it leaves out Flexipay or EMI balances that are not billed yet.
  An amount followed by C is a credit (payments, refunds, reversals); an amount followed by D
  is a debit (purchases, fees, taxes, interest, EMI instalments).
  The account summary prints no single total of debits: set total_debits to null and copy
  the Purchases & Other Debits and the Fee, Taxes & Interest Charges figures, in that order,
  into total_debits_parts. total_credits is the Payments, Reversals & other Credits figure.
  Summary labels can wrap across lines.
  Include the transactions of every card on the account, add-on cards too. Take
  account_last4 from the card number in the statement header, not from an add-on card.
  A row whose description says "(EXCL TAX x)" has a tax of x on top of its amount. If no
  separate row prints that tax (such as "IGST DB @ 18.00% x"), add one row for it: the same
  date and direction as its row, the amount x, and the description "Tax on " and the row's
  description. A charge and its reversal both carry the tax, so both get a tax row.
  Skip the reward points summary: its previous balance, additions and closing balance are
  points, not money.
